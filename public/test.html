<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C-Test Practice</title>

<style>
    body {
        font-family: system-ui, sans-serif;
        max-width: 1100px;
        margin: 0 auto;
        padding: 30px 20px;
        background: #f5f7fa;
        color: #222;
    }

    h1 {
        margin-bottom: 5px;
    }

    .subtitle {
        color: #666;
        margin-top: 0;
    }

    #score {
        position: sticky;
        top: 10px;
        background: #1e293b;
        color: white;
        padding: 14px 20px;
        border-radius: 10px;
        margin: 25px 0;
        z-index: 10;
        display: flex;
        justify-content: space-between;
    }

    .test {
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .progress {
        color: #666;
        font-size: .9rem;
        margin-bottom: 20px;
    }

    .text {
        font-size: 1.25rem;
        line-height: 2.2;
    }

    /*
     * Keep the word fragment immediately before the input together.
     * The input itself is also kept on the same line as that fragment.
     */
    .ctest-gap {
        display: inline-flex;
        align-items: baseline;
        white-space: nowrap;
    }

    input.answer {
        width: 110px;
        padding: 6px 8px;
        font-size: 1rem;
        border: 1px solid #aaa;
        border-radius: 5px;
        margin: 0 3px;
    }

    input.correct {
        border: 2px solid #2e9d50;
        background: #eaffef;
    }

    input.incorrect {
        border: 2px solid #d33;
        background: #fff0f0;
    }

    .feedback {
        margin-top: 25px;
        padding: 15px;
        border-radius: 7px;
        display: none;
    }

    .feedback.good {
        display: block;
        background: #e8f7ed;
        color: #176b31;
    }

    .feedback.bad {
        display: block;
        background: #fff0f0;
        color: #9b2226;
    }

    .correct-answer {
        font-weight: 600;
    }

    .buttons {
        margin-top: 25px;
        display: flex;
        gap: 10px;
    }

    button {
        border: 0;
        border-radius: 7px;
        padding: 11px 20px;
        font-size: 1rem;
        cursor: pointer;
        background: #2563eb;
        color: white;
    }

    button:hover {
        background: #1d4ed8;
    }

    button.secondary {
        background: #64748b;
    }

    button.secondary:hover {
        background: #475569;
    }

    button:disabled {
        background: #aaa;
        cursor: not-allowed;
    }

    #results {
        display: none;
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0,0,0,.08);
        text-align: center;
    }

    #results h2 {
        margin-top: 0;
    }

    .big-score {
        font-size: 3rem;
        font-weight: bold;
        color: #2563eb;
        margin: 20px 0;
    }

    .loading {
        color: #666;
    }
</style>
</head>

<body>

<h1>C-Test Practice</h1>
<p class="subtitle">Complete the missing parts of each word.</p>

<div id="score">
    <span id="progress">Test 0 of 0</span>
    <span id="scoreText">Score: 0 / 0</span>
</div>

<div id="testContainer">
    <p class="loading">Loading tests...</p>
</div>

<div id="results">
    <h2>Test Complete</h2>

    <div class="big-score" id="finalScore"></div>

    <p id="finalMessage"></p>

    <button onclick="restartTest()">Start Again</button>
</div>


<script>

// ------------------------------------------------------------
// State
// ------------------------------------------------------------

let tests = [];
let currentTest = 0;

let totalAnswered = 0;
let totalCorrect = 0;

let currentGraded = false;


// ------------------------------------------------------------
// Discover all JSON files in tests/
// ------------------------------------------------------------

async function discoverTestFiles() {

    const response = await fetch("tests/");

    if (!response.ok) {
        throw new Error("Could not access the tests directory.");
    }

    const html = await response.text();

    // Parse the directory listing generated by Python http.server
    const parser = new DOMParser();
    const document = parser.parseFromString(html, "text/html");

    const files = Array.from(
        document.querySelectorAll("a")
    )
        .map(link => link.getAttribute("href"))
        .filter(href =>
            href &&
            href.toLowerCase().endsWith(".json") &&
            !href.includes("/")
        )
        .map(href =>
            "tests/" + decodeURIComponent(href)
        );

    return files;
}


// ------------------------------------------------------------
// Load all tests
// ------------------------------------------------------------

async function loadTests() {

    const container = document.getElementById("testContainer");

    try {

        const testFiles = await discoverTestFiles();

        if (testFiles.length === 0) {
            throw new Error("No JSON test files found in tests/.");
        }

        for (const file of testFiles) {

            const response = await fetch(file);

            if (!response.ok) {
                throw new Error(`Could not load ${file}`);
            }

            const test = await response.json();

            tests.push(test);
        }

        if (tests.length === 0) {
            throw new Error("No tests found.");
        }

        // Randomize the order of the tests
        shuffle(tests);

        showTest();

    } catch (error) {

        container.innerHTML =
            `<p>Could not load the tests.</p>
             <p>${escapeHTML(error.message)}</p>`;
    }
}


function shuffle(array) {

    for (let i = array.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [array[i], array[j]] = [array[j], array[i]];
    }
}


// ------------------------------------------------------------
// Display current test
// ------------------------------------------------------------

function showTest() {

    const test = tests[currentTest];

    currentGraded = false;

    document.getElementById("progress").textContent =
        `Test ${currentTest + 1} of ${tests.length}`;

    const container = document.getElementById("testContainer");

    container.innerHTML = "";


    const testDiv = document.createElement("div");

    testDiv.className = "test";


    // Title

    const title = document.createElement("h2");

    title.textContent = test.title;

    testDiv.appendChild(title);


    // Text

    const textDiv = document.createElement("div");

    textDiv.className = "text";


    const parts = test.text.split("___");

    parts.forEach((part, index) => {

        /*
         * Add the text before the blank.
         */
        textDiv.appendChild(
            document.createTextNode(part)
        );


        if (index < parts.length - 1) {

            /*
             * Find the beginning of the current word.
             *
             * Example:
             *
             *   "The gover___ decided..."
             *
             * becomes:
             *
             *   "The "
             *   <span class="ctest-gap">
             *       "gover"
             *       <input>
             *   </span>
             *   " decided..."
             *
             * The span has white-space: nowrap, preventing
             * "gover" and the input from being separated.
             */
            const previousText = part;

            const match = previousText.match(/(\S+)$/);

            if (match) {

                const wordStart = match[1];

                /*
                 * Remove the word fragment that was just added
                 * as normal text.
                 */
                const textNode =
                    textDiv.lastChild;

                if (
                    textNode &&
                    textNode.nodeType === Node.TEXT_NODE
                ) {
                    textNode.textContent =
                        textNode.textContent.slice(
                            0,
                            -wordStart.length
                        );
                }


                const gap = document.createElement("span");

                gap.className = "ctest-gap";


                const wordNode =
                    document.createTextNode(wordStart);

                gap.appendChild(wordNode);


                const input =
                    document.createElement("input");

                input.type = "text";
                input.className = "answer";

                input.dataset.answer = index;

                input.autocomplete = "off";
                input.spellcheck = false;


                // Pressing Enter checks the test
                input.addEventListener(
                    "keydown",
                    function(event) {

                        if (event.key === "Enter") {
                            gradeTest();
                        }

                    }
                );


                gap.appendChild(input);

                textDiv.appendChild(gap);

            } else {

                /*
                 * Fallback for a blank occurring at the
                 * beginning of the text.
                 */
                const input =
                    document.createElement("input");

                input.type = "text";
                input.className = "answer";

                input.dataset.answer = index;

                input.autocomplete = "off";
                input.spellcheck = false;

                input.addEventListener(
                    "keydown",
                    function(event) {

                        if (event.key === "Enter") {
                            gradeTest();
                        }

                    }
                );

                textDiv.appendChild(input);
            }
        }
    });


    testDiv.appendChild(textDiv);


    // Feedback

    const feedback =
        document.createElement("div");

    feedback.id = "feedback";
    feedback.className = "feedback";

    testDiv.appendChild(feedback);


    // Buttons

    const buttons =
        document.createElement("div");

    buttons.className = "buttons";


    const endButton =
        document.createElement("button");

    endButton.textContent = "End Practice";
    endButton.className = "secondary";
    endButton.onclick = showResults;

    buttons.appendChild(endButton);


    const checkButton =
        document.createElement("button");

    checkButton.id = "checkButton";
    checkButton.textContent = "Check Answers";
    checkButton.onclick = gradeTest;

    buttons.appendChild(checkButton);


    const nextButton =
        document.createElement("button");

    nextButton.id = "nextButton";

    nextButton.textContent =
        currentTest === tests.length - 1
            ? "Finish"
            : "Next Test";

    nextButton.disabled = true;
    nextButton.onclick = nextTest;

    buttons.appendChild(nextButton);


    testDiv.appendChild(buttons);

    container.appendChild(testDiv);
}


// ------------------------------------------------------------
// Grade current test
// ------------------------------------------------------------

function gradeTest() {

    if (currentGraded) {
        return;
    }

    const test = tests[currentTest];

    const inputs =
        document.querySelectorAll(".answer");

    let correct = 0;


    inputs.forEach((input, index) => {

        const userAnswer =
            normalize(input.value);

        const correctAnswer =
            normalize(test.answers[index]);


        input.classList.remove(
            "correct",
            "incorrect"
        );


        if (userAnswer === correctAnswer) {

            correct++;

            input.classList.add("correct");

        } else {

            input.classList.add("incorrect");
        }
    });


    const total = test.answers.length;

    totalAnswered += total;
    totalCorrect += correct;

    currentGraded = true;


    // Feedback

    const feedback =
        document.getElementById("feedback");


    const percentage =
        Math.round((correct / total) * 100);


    feedback.classList.remove(
        "good",
        "bad"
    );


    if (correct === total) {

        feedback.classList.add("good");

        feedback.textContent =
            `Excellent! ${correct}/${total} correct (${percentage}%).`;

    } else {

        feedback.classList.add("bad");

        feedback.innerHTML =
            `${correct}/${total} correct (${percentage}%). ` +
            `Correct answers: ` +
            `<span class="correct-answer">${
                escapeHTML(test.answers.join(", "))
            }</span>`;
    }


    document.getElementById(
        "checkButton"
    ).disabled = true;


    document.getElementById(
        "nextButton"
    ).disabled = false;


    updateScore();
}


// ------------------------------------------------------------
// Next test
// ------------------------------------------------------------

function nextTest() {

    if (!currentGraded) {
        return;
    }


    if (currentTest < tests.length - 1) {

        currentTest++;

        showTest();

    } else {

        showResults();
    }
}


// ------------------------------------------------------------
// Show final results
// ------------------------------------------------------------

function showResults() {

    document.getElementById(
        "testContainer"
    ).style.display = "none";

    document.getElementById(
        "score"
    ).style.display = "none";

    document.getElementById(
        "results"
    ).style.display = "block";


    const percentage =
        totalAnswered === 0
            ? 0
            : Math.round(
                (totalCorrect / totalAnswered) * 100
            );


    document.getElementById(
        "finalScore"
    ).textContent =
        `${totalCorrect} / ${totalAnswered}`;


    if (totalAnswered === 0) {

        document.getElementById(
            "finalMessage"
        ).textContent =
            "No tests have been completed yet.";

    } else {

        document.getElementById(
            "finalMessage"
        ).textContent =
            `You scored ${percentage}% on the tests you completed.`;
    }
}


// ------------------------------------------------------------
// Restart
// ------------------------------------------------------------

function restartTest() {

    currentTest = 0;

    totalAnswered = 0;
    totalCorrect = 0;

    document.getElementById(
        "testContainer"
    ).style.display = "block";

    document.getElementById(
        "score"
    ).style.display = "flex";

    document.getElementById(
        "results"
    ).style.display = "none";

    updateScore();

    showTest();
}


// ------------------------------------------------------------
// Score display
// ------------------------------------------------------------

function updateScore() {

    document.getElementById(
        "scoreText"
    ).textContent =
        `Score: ${totalCorrect} / ${totalAnswered}`;
}


// ------------------------------------------------------------
// Answer normalization
// ------------------------------------------------------------

function normalize(value) {

    return value
        .trim()
        .toLowerCase()
        .replace(/[’‘]/g, "'")
        .replace(/\s+/g, " ");
}


// ------------------------------------------------------------
// Prevent HTML injection in answer display
// ------------------------------------------------------------

function escapeHTML(value) {

    const div =
        document.createElement("div");

    div.textContent = value;

    return div.innerHTML;
}


// ------------------------------------------------------------
// Start
// ------------------------------------------------------------

loadTests();

</script>

</body>
</html>
